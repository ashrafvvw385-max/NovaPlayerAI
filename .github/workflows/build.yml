
name: Build Android APK

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nova Player AI
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          curl -fL --retry 3 \
            -o /tmp/android-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

          unzip -q /tmp/android-tools.zip -d /tmp/android-cli

          mv /tmp/android-cli/cmdline-tools \
            "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" --licenses || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Download Whisper.cpp Source
        if: github.ref_name == 'development'
        shell: bash
        run: |
          set -euo pipefail

          DEST="app/src/main/cpp/whisper.cpp"

          git clone \
            --depth 1 \
            --branch v1.8.2 \
            https://github.com/ggml-org/whisper.cpp.git \
            "$DEST"

          test -f "$DEST/CMakeLists.txt"
          test -f "$DEST/include/whisper.h"

          echo "Whisper.cpp source downloaded."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlayerAI-debug-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
